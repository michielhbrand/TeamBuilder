name: Deploy to staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Validate Supabase environment
        run: npm run validate:env
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_VITE_SUPABASE_PUBLISHABLE_KEY }}
          BASE_PATH: /TeamBuilder/staging/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-staging
          path: dist
          retention-days: 1

  migrations:
    name: Push database migrations
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: |
          if [ -z "$STAGING_SUPABASE_DB_URL" ]; then
            echo "STAGING_SUPABASE_DB_URL repository secret is not set. Use the Session pooler connection string from the staging Supabase dashboard (Connect)."
            exit 1
          fi
          supabase db push --remote="$STAGING_SUPABASE_DB_URL" --yes
        env:
          STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

  functions:
    name: Deploy Supabase function
    needs: migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate free model
        env:
          KILO_MODEL: ${{ secrets.KILO_MODEL }}
        run: |
          model="$(printf '%s' "$KILO_MODEL" | tr -d '[:space:]')"
          if [ -z "$model" ]; then
            echo "KILO_MODEL repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$model" in
            *:free|kilo-auto/free) ;;
            *)
              echo "KILO_MODEL must name a free Kilo model (kilo-auto/free or a model id ending in :free), got '$model'."
              exit 1
              ;;
          esac

      - name: Set fit-analysis secrets
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_MODEL: ${{ secrets.KILO_MODEL }}
        run: |
          if [ -z "$KILO_API_KEY" ]; then
            echo "KILO_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          model="$(printf '%s' "$KILO_MODEL" | tr -d '[:space:]')"

          supabase secrets set \
            KILO_API_KEY="$KILO_API_KEY" \
            KILO_MODEL="$model" \
            --remote="$SUPABASE_PROJECT_ID" \
            --yes

      - name: Deploy fit-analysis
        run: supabase functions deploy fit-analysis --remote="$SUPABASE_PROJECT_ID" --yes

  deploy:
    name: Deploy
    needs: migrations
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://michielhbrand.github.io/TeamBuilder/staging/
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-staging
          path: dist

      - name: Deploy to GitHub Pages staging folder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: staging
          clean: true
