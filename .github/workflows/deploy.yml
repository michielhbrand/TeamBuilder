name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

      - name: Validate Supabase environment
        run: npm run validate:env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  functions:
    name: Deploy Supabase function
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate free model
        env:
          KILO_MODEL: ${{ secrets.KILO_MODEL }}
        run: |
          model="$(printf '%s' "$KILO_MODEL" | tr -d '[:space:]')"
          if [ -z "$model" ]; then
            echo "KILO_MODEL repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          case "$model" in
            *:free|kilo-auto/free) ;;
            *)
              echo "KILO_MODEL must name a free Kilo model (kilo-auto/free or a model id ending in :free), got '$model'."
              exit 1
              ;;
          esac

      - name: Set fit-analysis secrets
        env:
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          KILO_MODEL: ${{ secrets.KILO_MODEL }}
        run: |
          if [ -z "$KILO_API_KEY" ]; then
            echo "KILO_API_KEY repository secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          model="$(printf '%s' "$KILO_MODEL" | tr -d '[:space:]')"

          supabase secrets set \
            KILO_API_KEY="$KILO_API_KEY" \
            KILO_MODEL="$model" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy fit-analysis
        run: supabase functions deploy fit-analysis --project-ref "$SUPABASE_PROJECT_ID"

  deploy:
    name: Deploy
    needs: [build, functions]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
